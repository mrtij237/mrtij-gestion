:root { --encre:#15151A; --papier:#F1EEE7; --olive:#4A6000; --lime:#D4FF3A; --gris:#6b6a66; --trait:#d8d3c7; --blanc:#fbfaf6; --rouge:#a3300b; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:'Montserrat',system-ui,sans-serif; color:var(--encre); background:var(--papier); font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
/* ---------- Barre ---------- */
.barre { position:sticky; top:0; z-index:10; background:var(--encre); color:var(--papier); padding:env(safe-area-inset-top) 0 0; }
.barre-in { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px; }
.barre .marque { font-weight:800; letter-spacing:.5px; font-size:17px; display:flex; align-items:center; gap:8px; }
.barre .marque i { width:10px; height:10px; border-radius:50%; background:var(--lime); display:inline-block; }
.reseau { margin-left:auto; font-size:12px; opacity:.8; }
nav.onglets { background:var(--encre); border-top:1px solid #2a2a30; }
nav.onglets .in { max-width:1100px; margin:0 auto; display:flex; overflow-x:auto; padding:0 8px; scrollbar-width:none; }
nav.onglets button { background:none; border:0; color:#bdb9ad; padding:11px 12px; font-size:14px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
nav.onglets button.actif { color:var(--papier); border-bottom-color:var(--lime); }
main { max-width:1100px; margin:0 auto; padding:18px 16px 80px; }
h2 { color:var(--olive); font-size:22px; margin:4px 0 14px; font-weight:800; }
h3 { color:var(--olive); font-size:13px; text-transform:uppercase; letter-spacing:1px; margin:18px 0 8px; }
.carte { background:var(--blanc); border:1px solid var(--trait); border-radius:12px; padding:14px; margin-bottom:12px; }
.grille2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grille3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:700px) { .grille2, .grille3 { grid-template-columns:1fr; } }
label { display:block; font-size:12px; font-weight:600; color:var(--gris); margin-bottom:3px; }
input, select, textarea { width:100%; padding:10px 11px; border:1px solid var(--trait); border-radius:8px; background:#fff; font-size:15px; min-width:0; }
textarea { min-height:70px; resize:vertical; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--olive); outline-offset:-1px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:8px; border:1px solid var(--encre); background:var(--encre); color:var(--papier); font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; }
.btn.sec { background:transparent; color:var(--encre); }
.btn.lime { background:var(--lime); color:var(--encre); border-color:var(--encre); }
.btn.petit { padding:6px 10px; font-size:13px; }
.btn.danger { background:transparent; color:var(--rouge); border-color:var(--rouge); }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.ligne-presta { display:grid; grid-template-columns:2fr 3fr 70px 120px 36px; gap:8px; align-items:end; margin-bottom:8px; }
@media (max-width:700px) { .ligne-presta { grid-template-columns:1fr 1fr; padding-bottom:10px; border-bottom:1px dashed var(--trait); } .ligne-presta .desc { grid-column:1/-1; order:2 } }
.x { border:1px solid var(--trait); background:#fff; border-radius:8px; height:42px; cursor:pointer; }
.total-live { font-size:20px; font-weight:800; text-align:right; margin-top:8px; }
.total-live small { display:block; font-size:12px; font-weight:500; color:var(--gris); }
.projet { display:flex; justify-content:space-between; gap:10px; align-items:center; cursor:pointer; }
.projet .t { font-weight:700; }
.projet .s { font-size:13px; color:var(--gris); }
.badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; border:1px solid var(--encre); }
.badge.attente { background:#fff; }
.badge.acompte { background:#e9efd9; border-color:var(--olive); color:var(--olive); }
.badge.solde { background:var(--lime); }
.badge.annule { background:#eee; color:var(--gris); border-color:var(--gris); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.stats .carte { margin:0; }
.stats b { display:block; font-size:19px; }
.stats span { font-size:12px; color:var(--gris); }
@media (max-width:520px) { .stats { grid-template-columns:1fr 1fr; } .stats .carte:last-child { grid-column:1/-1 } }
.vide { text-align:center; color:var(--gris); padding:30px 10px; }
.msg { white-space:pre-wrap; background:#fff; border:1px solid var(--trait); border-radius:8px; padding:10px; font-size:14px; }
.res-est { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.res-est .carte { text-align:center; margin:0; }
.res-est b { font-size:20px; display:block; }
.res-est .annonce { background:var(--encre); color:var(--papier); }
.alerte { background:#ffe9dc; border:1px solid #f0b79b; color:#7a2608; padding:10px; border-radius:8px; font-size:14px; margin-top:10px; }
.info { background:#eef2e2; border:1px solid #c9d4a8; padding:10px; border-radius:8px; font-size:14px; margin-top:10px; }
.calc { font-size:13px; color:var(--gris); margin-top:8px; }
.paiement { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--trait); flex-wrap:wrap; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--encre); color:var(--papier); padding:10px 16px; border-radius:10px; font-size:14px; z-index:99; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on { opacity:1; }
canvas.apercu { max-width:100%; border-radius:8px; border:1px solid var(--trait); display:block; margin-top:10px; }
.cache { display:none !important; }

/* ---------- Visionneuse de document ---------- */
#visionneuse { position:fixed; inset:0; background:#3a3a3f; z-index:50; overflow:auto; }
#visionneuse .outils { position:sticky; top:0; background:var(--encre); padding:10px 16px calc(10px); padding-top:calc(10px + env(safe-area-inset-top)); display:flex; gap:8px; flex-wrap:wrap; z-index:2; }
#visionneuse .feuille-wrap { padding:16px; display:flex; justify-content:center; }
#visionneuse .echelle { transform-origin:top left; }

/* ---------- Document A4 (identique aux PDF) ---------- */
.doc { width:210mm; min-height:297mm; padding:11mm 15mm 9mm; position:relative; display:flex; flex-direction:column; background:var(--papier); color:var(--encre); font-size:9.5pt; line-height:1.45; box-shadow:0 4px 30px #0006; }
.doc header { display:flex; justify-content:space-between; align-items:center; gap:10mm; }
.doc .logo { height:17mm; }
.doc .coord { text-align:right; font-size:7.5pt; color:var(--gris); }
.doc .coord .titulaire { color:var(--encre); font-weight:700; font-size:8.5pt; }
.doc .bandeau { margin:5mm 0 4.5mm; padding:4mm 0 3mm; border-top:2.5px solid var(--encre); border-bottom:1px solid var(--trait); display:flex; justify-content:space-between; align-items:flex-end; position:relative; }
.doc .bandeau::before { content:''; position:absolute; left:0; top:-2.5px; width:22mm; height:2.5px; background:var(--lime); }
.doc h1 { margin:0; font-size:21pt; font-weight:800; color:var(--olive); letter-spacing:-0.3px; text-transform:uppercase; }
.doc .meta { text-align:right; font-size:8.5pt; }
.doc .meta span { color:var(--gris); }
.doc .deux-col { display:grid; grid-template-columns:1fr 1fr; gap:6mm; margin-bottom:4mm; align-items:start; }
.doc .bloc { background:#fff9; border:1px solid var(--trait); border-radius:2.5mm; padding:3.5mm 4mm; }
.doc .etiquette { font-size:7pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--olive); margin-bottom:1.5mm; }
.doc .nom { font-weight:700; font-size:10.5pt; }
.doc table { width:100%; border-collapse:collapse; }
.doc .prestations { margin-bottom:4mm; }
.doc .prestations th { text-align:left; font-size:7pt; text-transform:uppercase; letter-spacing:.8px; background:var(--encre); color:var(--papier); padding:2.2mm 2.5mm; font-weight:600; }
.doc .prestations td { padding:2.5mm; border-bottom:1px solid var(--trait); vertical-align:top; }
.doc .prestations .des { font-weight:600; }
.doc .n { text-align:right; white-space:nowrap; }
.doc .totaux { margin-left:auto; width:95mm; margin-bottom:5mm; }
.doc .totaux > div { display:flex; justify-content:space-between; padding:1.3mm 0; }
.doc .totaux .grand, .doc .recap .grand td { font-weight:800; font-size:12pt; border-top:2px solid var(--encre); padding-top:2mm; }
.doc .totaux .grand span:last-child { box-shadow: inset 0 -3.5mm 0 var(--lime); }
.doc .lettres { font-size:8.5pt; color:var(--gris); display:block !important; }
.doc .lettres b { color:var(--encre); }
.doc .mini td { padding:1.4mm 0 1.4mm 3mm; border-bottom:1px solid var(--trait); }
.doc .recap { width:100mm; margin:0 0 5mm auto; font-size:10pt; }
.doc .bloc ul { margin:0; padding-left:4mm; font-size:7.6pt; }
.doc .bloc li { margin-bottom:0.3mm; }
.doc .petit { font-size:7.4pt; color:var(--gris); margin-top:1.5mm; }
.doc .recu-montant { border:1.5px solid var(--encre); border-radius:2.5mm; padding:5mm; margin-bottom:5mm; }
.doc .recu-montant .gros { font-size:24pt; font-weight:800; }
.doc .accord { display:grid; grid-template-columns:1fr 1fr; gap:6mm; margin-top:auto; align-items:end; }
.doc .ligne-sign { height:13mm; border-bottom:1px dashed var(--gris); }
.doc .signature-zone { display:flex; justify-content:flex-end; margin-top:auto; }
.doc .accord .signature-zone { margin-top:0; }
.doc .sign { text-align:center; width:62mm; }
.doc .sign img { height:18mm; display:block; margin:0 auto -2mm; }
.doc footer { grid-column:1 / -1; margin-top:3mm; padding-top:2.5mm; border-top:1px solid var(--trait); font-size:7pt; color:var(--gris); text-align:center; }
.doc .manque { background:#ffe2d6; color:#a3300b; font-weight:700; padding:0 1mm; border-radius:1mm; }

@page { size:A4; margin:0; }
@media print {
  body { background:var(--papier); }
  body > *:not(#visionneuse) { display:none !important; }
  #visionneuse { position:static; background:none; overflow:visible; }
  #visionneuse .outils { display:none; }
  #visionneuse .feuille-wrap { padding:0; display:block; }
  #visionneuse .echelle { transform:none !important; width:auto !important; height:auto !important; }
  .doc { box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .doc .manque { background:none; }
}
</style>
</head>
<body>
<div class="barre"><div class="barre-in">
  <div class="marque"><i></i>MR TIJ · Gestion</div>
  <div class="reseau" id="reseau"></div>
</div>

  <button data-vue="estimer">Estimer un prix</button>
  <button data-vue="filigrane">Aperçu filigrane</button>

</div></nav>
</div>

/* Montants en lettres */
const UN = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const DIZ = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
function m100(n){ if(n<20) return UN[n]; const d=Math.floor(n/10); let u=n%10; if(d===7||d===9) u+=10; const w=DIZ[d]; if(u===0) return d===8?'quatre-vingts':w; if((u===1||u===11)&&d!==8&&d!==9) return w+' et '+UN[u]; return w+'-'+UN[u]; }
function m1000(n,pl=true){ const c=Math.floor(n/100), r=n%100; let w=''; if(c>0){ w=c===1?'cent':UN[c]+' cent'; if(c>1&&r===0&&pl) w+='s'; } if(r>0){ let s=m100(r); if(!pl&&s==='quatre-vingts') s='quatre-vingt'; w+=(w?' ':'')+s; } return w; }
function enLettres(n){ n=Math.round(n); if(n===0) return 'zéro'; const p=[]; const G=Math.floor(n/1e9), M=Math.floor(n%1e9/1e6), K=Math.floor(n%1e6/1e3), R=n%1e3;
  if(G) p.push(m1000(G)+' milliard'+(G>1?'s':'')); if(M) p.push(m1000(M)+' million'+(M>1?'s':'')); if(K) p.push(K===1?'mille':m1000(K,false)+' mille'); if(R) p.push(m1000(R)); return p.join(' '); }
function lettres(n){ n=Math.round(n); const s=enLettres(n)+(n>=1e6&&n%1e6===0?' de':'')+' francs CFA'; return s[0].toUpperCase()+s.slice(1); }

/* Échéancier (section 8) */
function echeancierPour(total) {
  if (total < 20000) return [{libelle:'Paiement à la commande',pct:100}];
  if (total > 300000) return [{libelle:'Acompte à la commande',pct:40},{libelle:'À mi-parcours',pct:30},{libelle:'Solde avant livraison',pct:30}];
  return [{libelle:'Acompte à la commande',pct:50},{libelle:'Solde avant livraison des fichiers finaux',pct:50}];
}
function repartir(total, ech) { let c=0; return ech.map((e,i)=>{ const m = i===ech.length-1 ? total-c : Math.round(total*e.pct/100/500)*500; c+=m; return {...e, montant:m}; }); }

/* Calculs projet */
function totaux(p) {
  const sous = (p.lignes||[]).reduce((s,l)=>s + num(l.quantite||1)*num(l.prix_unitaire), 0);
  const remise = p.remise_pct ? Math.round(sous*num(p.remise_pct)/100) : 0;
  const total = sous - remise;
  const verse = (p.paiements||[]).reduce((s,x)=>s+num(x.montant),0);
  return { sous, remise, total, verse, reste: total - verse };
}
function statut(p) {
  if (p.annule) return ['annule','Annulé'];
  const t = totaux(p);
  if (t.verse <= 0) return ['attente','Proforma envoyée'];
  if (t.reste <= 0) return ['solde','Soldé'];
  return ['acompte','Acompte reçu'];
}

function vueProjets(app) {
  const ps = [...DB.projets].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const actifs = ps.filter(p=>!p.annule);
  const encaisse = actifs.reduce((s,p)=>s+totaux(p).verse,0);
  const attendu = actifs.reduce((s,p)=>s+Math.max(0,totaux(p).reste),0);
  app.innerHTML = `
    <h2>Projets</h2>
    <div class="stats">
      <div class="carte"><b>${actifs.length}</b><span>projets</span></div>
      <div class="carte"><b>${Fc(encaisse)}</b><span>encaissé</span></div>
      <div class="carte"><b>${Fc(attendu)}</b><span>reste à encaisser</span></div>
    </div>
    <input id="recherche" placeholder="Rechercher un client, un numéro…" style="margin-bottom:12px">
    <div id="liste"></div>
    <div class="actions"><button class="btn" onclick="nouveauDevis()">+ Nouvelle proforma</button></div>`;
  const rendre = (q='') => {
    q = q.toLowerCase();
    const f = ps.filter(p => !q || [p.client?.nom, p.client?.entreprise, p.objet, p.numero].join(' ').toLowerCase().includes(q));
    $('#liste').innerHTML = f.length ? f.map(p => { const [c,l]=statut(p); const t=totaux(p); return `
      <div class="carte projet" onclick="aller('projet','${p.id}')">
        <div><div class="t">${esc(p.client?.nom || 'Client sans nom')}${p.client?.entreprise ? ' · '+esc(p.client.entreprise) : ''}</div>
        <div class="s">${esc(p.numero)} · ${esc(p.objet||'')} · ${Fc(t.total)}</div></div>
        <span class="badge ${c}">${l}</span></div>`; }).join('')
      : `<div class="vide">${ps.length ? 'Aucun résultat.' : 'Aucun projet pour l’instant.<br>Crée ta première proforma.'}</div>`;
  };
  rendre(); $('#recherche').oninput = (e) => rendre(e.target.value);
}

/* ---------- Nouvelle proforma / modification ---------- */
function nouveauDevis(lignesInit) {
  brouillon = { id:null, date:aujourdhui(), client:{nom:'',entreprise:'',telephone:'',ville:'Douala',type:'particulier'}, objet:'', delai:'', retouches:2, remise_pct:0,
    lignes: lignesInit || [{designation:'',description:'',quantite:1,prix_unitaire:''}], langue:'fr' };
  aller('devis');
}
function vueDevis(app) {
  if (!brouillon) { nouveauDevis(); return; }
  const b = brouillon, edition = !!b.id;
  app.innerHTML = `
    <h2>${edition ? 'Modifier ' + esc(b.numero) : 'Nouvelle proforma'}</h2>
    ${edition ? '' : `<div class="info">Numéro attribué à l’enregistrement : <b>${apercuNumero('PRO')}</b></div>`}
    <h3>Client</h3>
    <div class="carte grille2">
      <div><label>Nom du client *</label><input data-c="nom" value="${esc(b.client.nom)}"></div>
      <div><label>Entreprise</label><input data-c="entreprise" value="${esc(b.client.entreprise)}"></div>
      <div><label>Téléphone / WhatsApp</label><input data-c="telephone" inputmode="tel" value="${esc(b.client.telephone)}"></div>
      <div><label>Ville</label><input data-c="ville" value="${esc(b.client.ville)}"></div>
    </div>
    <h3>Projet</h3>
    <div class="carte">

      <div class="grille3" style="margin-top:10px">
        <div><label>Date</label><input type="date" id="date" value="${b.date}"></div>
        <div><label>Délai de livraison</label><input id="delai" placeholder="ex. 5 jours ouvrés" value="${esc(b.delai)}"></div>
        <div><label>Séries de retouches incluses</label><input id="retouches" type="number" min="0" value="${b.retouches}"></div>

        <button class="btn sec petit" id="ajLigne">+ Ligne</button>
        <select id="ajGrille" style="width:auto;flex:1;min-width:200px"><option value="">+ Depuis la grille tarifaire…</option>${DB.grille.map((g,i)=>`<option value="${i}">${esc(g.nom)} (${Fc(g.min)}–${Fc(g.max)})</option>`).join('')}</select>
      </div>
      <div class="grille2" style="margin-top:12px">
        <div><label>Remise (%) — 15 % maximum</label><input id="remise" type="number" min="0" max="15" value="${b.remise_pct||0}"></div>
        <div class="total-live" id="totalLive"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="enregistrer">${edition ? 'Enregistrer les modifications' : 'Enregistrer et voir la proforma'}</button>
      <button class="btn sec" onclick="brouillon=null;aller('${edition?'projet':'projets'}','${b.id||''}')">Annuler</button>
    </div>`;
  const majTotal = () => {
    const t = totaux(b);
    $('#totalLive').innerHTML = `${F(t.total)}<small>${t.remise ? 'après remise de ' + F(t.remise) + ' · ' : ''}${lettres(t.total)}</small>`;
  };
  const rendreLignes = () => {
    $('#lignes').innerHTML = b.lignes.map((l,i)=>`
      <div class="ligne-presta" data-i="${i}">
        <div><label>Désignation</label><input data-l="designation" value="${esc(l.designation)}"></div>
        <div class="desc"><label>Description</label><input data-l="description" value="${esc(l.description)}"></div>
        <div><label>Qté</label><input data-l="quantite" type="number" min="1" inputmode="numeric" value="${esc(l.quantite)}"></div>
        <div><label>Prix unitaire (F)</label><input data-l="prix_unitaire" inputmode="numeric" value="${esc(l.prix_unitaire)}"></div>
        <button class="x" title="Supprimer" data-suppr="${i}">✕</button>
      </div>`).join('');
    $$('#lignes input').forEach(inp => inp.oninput = () => { const i = +inp.closest('.ligne-presta').dataset.i; b.lignes[i][inp.dataset.l] = inp.value; majTotal(); });
    $$('#lignes [data-suppr]').forEach(x => x.onclick = () => { b.lignes.splice(+x.dataset.suppr,1); if(!b.lignes.length) b.lignes.push({designation:'',description:'',quantite:1,prix_unitaire:''}); rendreLignes(); majTotal(); });
  };
  rendreLignes(); majTotal();
  $$('[data-c]').forEach(inp => inp.oninput = () => b.client[inp.dataset.c] = inp.value);
  $('#objet').oninput = e => b.objet = e.target.value;
  $('#date').onchange = e => b.date = e.target.value;
  $('#delai').oninput = e => b.delai = e.target.value;
  $('#retouches').oninput = e => b.retouches = num(e.target.value);
  $('#remise').oninput = e => { b.remise_pct = Math.min(15, num(e.target.value)); majTotal(); };
  $('#ajLigne').onclick = () => { b.lignes.push({designation:'',description:'',quantite:1,prix_unitaire:''}); rendreLignes(); };
  $('#ajGrille').onchange = e => { const g = DB.grille[e.target.value]; if(!g) return;
    const vide = b.lignes.length===1 && !b.lignes[0].designation && !b.lignes[0].prix_unitaire;
    const l = {designation:g.nom, description:g.contenu, quantite:1, prix_unitaire:''};
    if (vide) b.lignes[0]=l; else b.lignes.push(l);
    if (!b.delai && g.delai !== '—') { b.delai = g.delai; $('#delai').value = g.delai; }
    e.target.value=''; rendreLignes(); toast('Ligne ajoutée : indique le prix (utilise l’onglet Estimer)'); };
  $('#enregistrer').onclick = () => {
    b.lignes = b.lignes.filter(l => l.designation || l.prix_unitaire);
    if (!b.client.nom.trim()) return toast('Indique le nom du client');
    if (!b.lignes.length || b.lignes.some(l=>!num(l.prix_unitaire))) { if(!b.lignes.length) b.lignes.push({designation:'',description:'',quantite:1,prix_unitaire:''}); rendreLignes(); return toast('Chaque ligne doit avoir un prix'); }
    if (edition) { const i = DB.projets.findIndex(p=>p.id===b.id); DB.projets[i] = b; }
    else { b.id = uid(); b.numero = prochainNumero('PRO', b.date); b.paiements = []; b.fichiers_livres = []; DB.projets.push(b); }
    sauver(); const id = b.id; brouillon = null; aller('projet', id); voirDoc(id, 'proforma');
  };
}

/* ---------- Fiche projet ---------- */
function vueProjet(app, id) {
  const p = DB.projets.find(x=>x.id===id); if(!p) return aller('projets');
  projetOuvert = id;
  const t = totaux(p), [c,l] = statut(p);
  const ech = repartir(t.total, echeancierPour(t.total));
  let cumul = 0, prochain = t.reste;
  for (const e of ech) { cumul += e.montant; if (cumul > t.verse) { prochain = cumul - t.verse; break; } }
  app.innerHTML = `
    <div class="actions" style="margin:0 0 10px"><button class="btn sec petit" onclick="aller('projets')">← Projets</button></div>
    <h2>${esc(p.client.nom)}${p.client.entreprise?' · '+esc(p.client.entreprise):''} <span class="badge ${c}" style="vertical-align:middle">${l}</span></h2>
    <div class="carte">
      <div><b>${esc(p.objet)}</b></div>
      <div class="calc">${esc(p.numero)} · ${dateFr(p.date)} · ${esc(p.client.telephone||'')} · ${esc(p.client.ville||'')}</div>
      <div class="stats" style="margin:12px 0 0">
        <div class="carte"><b>${Fc(t.total)}</b><span>total</span></div>
        <div class="carte"><b>${Fc(t.verse)}</b><span>versé</span></div>
        <div class="carte"><b>${Fc(t.reste)}</b><span>reste à payer</span></div>
      </div>
      <div class="actions">
        <button class="btn" onclick="voirDoc('${p.id}','proforma')">Proforma (PDF)</button>
        ${t.verse ? '' : `<button class="btn sec" onclick="modifier('${p.id}')">Modifier</button>`}
        <button class="btn sec" onclick="dupliquer('${p.id}')">Dupliquer</button>
        ${p.annule ? `<button class="btn sec" onclick="annuler('${p.id}',false)">Réactiver</button>` : `<button class="btn danger" onclick="annuler('${p.id}',true)">Annuler le projet</button>`}
      </div>
    </div>

    <h3>Paiements</h3>
    <div class="carte">
      ${(p.paiements||[]).length ? p.paiements.map((x,i)=>`
        <div class="paiement"><div><b>${F(x.montant)}</b> · ${dateFr(x.date)} · ${esc(x.moyen)}${x.ref?' · réf. '+esc(x.ref):''}<div class="calc" style="margin:0">${esc(x.recu)}</div></div>
        <div class="actions" style="margin:0"><button class="btn petit" onclick="voirDoc('${p.id}','recu',${i})">Reçu (PDF)</button>${i===p.paiements.length-1?`<button class="btn danger petit" onclick="supprPaiement('${p.id}')">Supprimer</button>`:''}</div></div>`).join('')
        : '<div class="calc" style="margin:0">Aucun paiement enregistré.</div>'}
      ${t.reste > 0 && !p.annule ? `
      <h3>Enregistrer un paiement</h3>
      <div class="grille2">
        <div><label>Montant reçu (F)</label><input id="pMontant" inputmode="numeric" value="${prochain}"></div>
        <div><label>Date</label><input id="pDate" type="date" value="${aujourdhui()}"></div>
        <div><label>Moyen de paiement</label><select id="pMoyen"><option>Orange Money</option><option>MTN MoMo</option><option>Espèces</option><option>Virement</option></select></div>
        <div><label>Référence de transaction</label><input id="pRef" placeholder="ex. CI241124.1530.A12345"></div>
        <div><label>Livraison prévue (pour le reçu d’acompte)</label><input id="pLivraison" placeholder="ex. 2 décembre 2026" value="${esc(p.date_livraison||'')}"></div>
        <div><label>Fichiers livrés (si paiement final, un par ligne)</label><textarea id="pFichiers">${esc((p.fichiers_livres||[]).join('\n'))}</textarea></div>
      </div>
      <div class="info" id="pInfo"></div>
      <div class="actions"><button class="btn lime" id="pOk">Enregistrer et émettre le reçu</button></div>` : ''}
    </div>

    <h3>Messages WhatsApp</h3>
    <div class="carte">
      <select id="mType">
        <option value="prix">Envoi du prix (avec la proforma)</option>
        <option value="acompte">Confirmation d’acompte</option>
        <option value="apercu">Aperçu + demande du solde</option>
        <option value="livraison">Livraison finale</option>
        <option value="relance">Relance de paiement</option>
        <option value="refus">Refus poli (pas d’accord sur le prix)</option>
      </select>
      <div class="msg" id="mTexte" style="margin-top:10px"></div>
      <div class="actions"><button class="btn" id="mCopier">Copier</button><a class="btn sec" id="mWa" target="_blank" rel="noopener">Ouvrir WhatsApp</a></div>
    </div>`;

  if ($('#pOk')) {
    const majInfo = () => { const m = num($('#pMontant').value); const reste = t.reste - m;
      $('#pInfo').innerHTML = reste <= 0 ? `Ce paiement solde le projet : un <b>reçu final</b> (${apercuNumero('RF')}) sera émis.` : `Un <b>reçu d’acompte</b> (${apercuNumero('RA')}) sera émis. Reste après ce versement : <b>${F(reste)}</b>.`; };
    $('#pMontant').oninput = majInfo; majInfo();
    $('#pOk').onclick = () => {
      const m = num($('#pMontant').value);
      if (m <= 0) return toast('Montant invalide');
      if (m > t.reste) return toast('Le montant dépasse le reste à payer (' + F(t.reste) + ')');
      const final = t.reste - m <= 0, d = $('#pDate').value || aujourdhui();
      p.date_livraison = $('#pLivraison').value.trim();
      p.fichiers_livres = $('#pFichiers').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const x = { date:d, montant:m, moyen:$('#pMoyen').value, ref:$('#pRef').value.trim(), type: final?'final':'acompte', recu: prochainNumero(final?'RF':'RA', d) };
      p.paiements.push(x); sauver(); aller('projet', p.id); voirDoc(p.id, 'recu', p.paiements.length-1);
    };
  }
  const majMsg = () => { const txt = messageWA(p, $('#mType').value); $('#mTexte').textContent = txt;
    const tel = (p.client.telephone||'').replace(/\D/g,''); const tel2 = tel.length===9 ? '237'+tel : tel;
    $('#mWa').href = (tel2 ? 'https://wa.me/'+tel2 : 'https://wa.me/') + '?text=' + encodeURIComponent(txt); };
  const s = statut(p)[0]; $('#mType').value = s==='attente' ? 'prix' : s==='acompte' ? 'apercu' : s==='solde' ? 'livraison' : 'prix';
  $('#mType').onchange = majMsg; majMsg();
  $('#mCopier').onclick = () => copier($('#mTexte').textContent);
}
function copier(txt) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Message copié'), ()=>copierVieux(txt)); else copierVieux(txt);
}
function copierVieux(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Message copié');}catch(e){} ta.remove(); }
function modifier(id){ brouillon = JSON.parse(JSON.stringify(DB.projets.find(p=>p.id===id))); aller('devis'); }
function dupliquer(id){ const p = DB.projets.find(x=>x.id===id); brouillon = { ...JSON.parse(JSON.stringify(p)), id:null, numero:null, date:aujourdhui(), paiements:[], fichiers_livres:[], annule:false }; aller('devis'); }
function annuler(id, oui){ const p = DB.projets.find(x=>x.id===id); if (oui && !confirm('Annuler ce projet ? Son numéro reste utilisé.')) return; p.annule = oui; sauver(); aller('projet', id); }
function supprPaiement(id){ const p = DB.projets.find(x=>x.id===id); if(!confirm('Supprimer le dernier paiement ? Le numéro de reçu ne sera pas réutilisé.')) return; p.paiements.pop(); sauver(); aller('projet', id); }

/* Messages WhatsApp (section 9) */
function messageWA(p, type) {
  const t = totaux(p), prenom = (p.client.nom||'').split(' ')[0] || '';
  const ech = repartir(t.total, echeancierPour(t.total));
  const dernier = (p.paiements||[]).slice(-1)[0];
  const pay = 'Orange Money : 656 43 90 25\nMTN MoMo : 675 32 60 58\n(titulaire : Jores TAMOU Kamgaing)';
  switch (type) {
    case 'prix': return `Bonjour ${prenom} 👋\n\nMerci pour votre confiance. Voici la proforma ${p.numero} pour : ${p.objet}.\n\nMontant total : ${F(t.total)}\n${ech.length===1 ? 'Paiement de 100 % à la commande.' : `Acompte pour démarrer : ${F(ech[0].montant)} (${ech[0].pct} %)`}\nDélai : ${p.delai || '[À COMPLÉTER]'} à partir de l’acompte et de la réception de vos éléments.\n\nPaiement :\n${pay}\n\nLa proforma est valable 15 jours. Un simple « OK » ici vaut bon pour accord. Je reste disponible pour toute question.\n\nMr TIJ`;
    case 'acompte': return `Bonjour ${prenom},\n\nJ’ai bien reçu votre versement de ${dernier ? F(dernier.montant) : '[À COMPLÉTER]'}, merci ! 🙏 Votre reçu ${dernier ? dernier.recu : ''} est joint.\n\nReste à payer : ${F(t.reste)}.\nLe travail démarre dès réception de tous vos éléments (textes, photos, logo…). Livraison prévue : ${p.date_livraison || '[À COMPLÉTER]'}.\n\nMr TIJ`;
    case 'apercu': return `Bonjour ${prenom},\n\nVotre projet « ${p.objet} » est prêt ✅ Voici l’aperçu (version protégée).\n\nPour recevoir les fichiers finaux en haute définition, merci de régler le solde de ${F(t.reste)} :\n${pay}\n\nDès réception, je vous envoie tout. Merci !\n\nMr TIJ`;
    case 'livraison': return `Bonjour ${prenom},\n\nPaiement bien reçu, merci ! 🎉 Voici vos fichiers finaux :\n${(p.fichiers_livres||[]).map(f=>'• '+f).join('\n') || '• [À COMPLÉTER]'}\n\nVotre reçu final ${dernier ? dernier.recu : ''} est joint.\nCe fut un plaisir de travailler avec vous. Un petit avis ou une recommandation m’aiderait beaucoup 🙏\n\nMr TIJ`;
    case 'relance': return `Bonjour ${prenom}, j’espère que vous allez bien.\n\nPetit rappel concernant « ${p.objet} » (${p.numero}) : il reste ${F(t.reste)} à régler.\n${pay}\n\nN’hésitez pas à me dire si vous avez une question. Merci !\n\nMr TIJ`;
    case 'refus': return `Bonjour ${prenom},\n\nMerci pour l’échange et pour l’intérêt porté à mon travail. Je ne peux malheureusement pas descendre plus bas sur ce tarif sans réduire la qualité de la prestation.\n\nSi votre budget évolue, ou si vous souhaitez une version plus simple, je serai ravi d’en reparler. Au plaisir de travailler ensemble une prochaine fois !\n\nMr TIJ`;
  }
}

/* ================= Documents (proforma, reçus) ================= */
function entete(titre, numero, meta) {
  return `<header><img class="logo" src="${LOGO}" alt="Mr TIJ"><div class="coord"><div class="titulaire">${MR_TIJ.titulaire}</div><div>${MR_TIJ.activite}</div><div>${MR_TIJ.ville} · NIU ${MR_TIJ.niu}</div><div>${MR_TIJ.contacts}</div></div></header>
  <div class="bandeau"><h1>${titre}</h1><div class="meta"><div><span>N°</span> <b>${v(numero)}</b></div>${meta.map(([k,x])=>`<div><span>${k}</span> ${x}</div>`).join('')}</div></div>`;
}
function blocClient(c) { return `<div class="bloc"><div class="etiquette">Client</div><div class="nom">${v(c.nom)}</div>${c.entreprise?`<div>${esc(c.entreprise)}</div>`:''}<div>Tél. : ${v(c.telephone)}</div><div>${v(c.ville)}</div></div>`; }
const signature = () => `<div class="signature-zone"><div class="sign"><div class="etiquette">Pour Mr TIJ</div><img src="${SIGNATURE}" alt="Signature"><div class="petit">${MR_TIJ.titulaire}</div></div></div>`;
const piedDoc = () => `<footer>Prestataire indépendant — NIU : ${MR_TIJ.niu} — TVA non applicable<br>Paiement : ${MR_TIJ.paiement}</footer>`;

function docProforma(p) {
  const t = totaux(p), ech = repartir(t.total, echeancierPour(t.total)), r = p.retouches ?? 2;
  return entete('Facture proforma', p.numero, [['Date', v(dateFr(p.date))], ['Valable jusqu’au', v(dateFr(plusJours(p.date,15)))]]) + `
  <div class="deux-col">${blocClient(p.client)}<div class="bloc"><div class="etiquette">Objet</div><div class="nom">${v(p.objet)}</div><div>Délai de livraison : ${v(p.delai)}</div><div>Retouches incluses : ${r} séries</div></div></div>
  <table class="prestations"><thead><tr><th>Désignation</th><th>Description</th><th class="n">Qté</th><th class="n">Prix unitaire</th><th class="n">Total</th></tr></thead><tbody>
  ${p.lignes.map(l=>`<tr><td class="des">${esc(l.designation)}</td><td>${esc(l.description)}</td><td class="n">${num(l.quantite||1)}</td><td class="n">${F(num(l.prix_unitaire))}</td><td class="n">${F(num(l.quantite||1)*num(l.prix_unitaire))}</td></tr>`).join('')}
  </tbody></table>
  <div class="totaux">${t.remise?`<div><span>Sous-total</span><span>${F(t.sous)}</span></div><div><span>Remise (${p.remise_pct} %)</span><span>− ${F(t.remise)}</span></div>`:''}
  <div class="grand"><span>Total à payer</span><span>${F(t.total)}</span></div><div class="lettres">Arrêtée à la somme de : <b>${lettres(t.total)}</b></div></div>
  <div class="deux-col"><div class="bloc"><div class="etiquette">Modalités de paiement</div><table class="mini">${ech.map(e=>`<tr><td>${e.libelle}</td><td class="n">${e.pct} %</td><td class="n"><b>${F(e.montant)}</b></td></tr>`).join('')}</table><div class="petit">${MR_TIJ.paiement}</div></div>
  <div class="bloc"><div class="etiquette">Conditions</div><ul>
    <li>Le délai court à partir de l’acompte et de la réception de tous les éléments du client.</li>
    <li>${r} séries de retouches incluses ; au-delà, retouches facturées.</li>
    <li>Un changement de direction après validation est un nouveau travail, facturé à part.</li>
    <li>Aperçu présenté avec filigrane Mr TIJ ; fichiers finaux livrés après le solde.</li>
    <li>Fichiers sources non inclus sauf mention (option +30 %).</li>
    <li>Acompte non remboursé si le client abandonne après le début du travail.</li>
    <li>Mr TIJ peut présenter le travail dans son portfolio, sauf demande contraire.</li>
    <li>Proforma valable 15 jours.</li></ul></div></div>
  <div class="accord"><div class="bloc"><div class="etiquette">Bon pour accord — client</div><div class="petit">Date, nom et signature, ou confirmation écrite par WhatsApp</div><div class="ligne-sign"></div></div>${signature()}${piedDoc()}</div>`;
}
function docRecu(p, i) {
  const x = p.paiements[i], t = totaux(p);
  const avant = p.paiements.slice(0,i).reduce((s,y)=>s+num(y.montant),0);
  const reste = t.total - avant - num(x.montant);
  if (x.type === 'final' || reste <= 0) {
    const vs = p.paiements.slice(0,i+1), tv = vs.reduce((s,y)=>s+num(y.montant),0);
    return entete('Reçu final', x.recu, [['Date', v(dateFr(x.date))], ['Réf. proforma', v(p.numero)]]) + `
    <div class="deux-col">${blocClient(p.client)}<div class="bloc"><div class="etiquette">Objet</div><div class="nom">${v(p.objet)}</div><div>Total du projet : <b>${F(t.total)}</b></div></div></div>
    <table class="prestations"><thead><tr><th>Date</th><th>Versement</th><th>Moyen / référence</th><th class="n">Montant</th></tr></thead><tbody>
    ${vs.map((y,j)=>`<tr><td>${dateFr(y.date)}</td><td>${j===vs.length-1?'Solde':'Acompte'} (${esc(y.recu)})</td><td>${esc(y.moyen)} · ${v(y.ref)}</td><td class="n">${F(y.montant)}</td></tr>`).join('')}
    </tbody></table>
    <div class="totaux"><div><span>Dernier versement</span><span>${F(x.montant)}</span></div><div><span>Total versé</span><span>${F(tv)}</span></div>

  const p = DB.projets.find(x=>x.id===id);
  const html = type === 'proforma' ? docProforma(p) : docRecu(p, i);

    <div class="feuille-wrap"><div class="echelle"><div class="doc">${html}</div></div></div>`;

    e.style.transform = `scale(${s})`; e.style.width = w*s+'px'; e.style.height = h*s+'px'; };
  ajuster(); window.onresize = ajuster;

/* ================= Estimateur (section 6) ================= */
let EST = { g:4, cx:'standard', cl:'particulier', urg:0, sources:false, retouches:0, declinaisons:0, heures:null, qte:1 };
function arrondir(n){ const pas = n < 20000 ? 1000 : 5000; return Math.ceil(n/pas)*pas; }
function estimer(e) {
  const g = DB.grille[e.g];
  const base = e.cx==='simple' ? g.min : e.cx==='complexe' ? g.max : (g.min+g.max)/2;
  const kCx = {simple:1, standard:1.3, complexe:1.6}[e.cx];
  const kCl = {particulier:1, pme:1.3, grande:1.8}[e.cl];
  let prix = base*kCx*kCl*(1+e.urg);
  const sources = e.sources ? prix*0.3 : 0;
  const opts = sources + e.retouches*7500 + e.declinaisons*4000;
  const plancher = arrondir(prix + opts);
  const marge = (plancher > 300000 || e.cl==='grande') ? 0.20 : plancher >= 50000 ? 0.15 : 0.10;
  const plafond = g.max + opts; // le haut de grille, options en sus
  let annonce = arrondir(plancher*(1+marge));
  let plafonne = false, auDessus = false;
  if (annonce > plafond) { annonce = Math.max(plancher, arrondir(plafond)); plafonne = true; }
  if (plancher > plafond) auDessus = true;
  const cible = arrondir((annonce+plancher)/2);
  const heures = e.heures ?? g.heures;
  return { g, base, kCx, kCl, prix, opts, plancher, marge, annonce, cible, plafonne, auDessus, heures, tauxH: plancher/heures };
}
function vueEstimer(app) {
  const e = EST;
  app.innerHTML = `<h2>Estimer un prix</h2>
  <div class="carte">
    <div><label>Prestation</label><select id="eG">${DB.grille.map((g,i)=>`<option value="${i}" ${i==e.g?'selected':''}>${esc(g.nom)} · ${Fc(g.min)}–${Fc(g.max)}</option>`).join('')}</select></div>
    <div class="calc" id="eContenu"></div>
    <div class="grille3" style="margin-top:10px">
      <div><label>Complexité</label><select id="eCx"><option value="simple">Simple ×1,0</option><option value="standard">Standard ×1,3</option><option value="complexe">Complexe ×1,6</option></select></div>
      <div><label>Type de client</label><select id="eCl"><option value="particulier">Particulier / petit commerce ×1,0</option><option value="pme">PME ×1,3</option><option value="grande">Grande entreprise / ONG / institution ×1,8</option></select></div>
      <div><label>Urgence</label><select id="eUrg"><option value="0">Normale</option><option value="0.3">Moins de 48 h (+30 %)</option><option value="0.5">Le jour même (+50 %)</option></select></div>
      <div><label>Retouches supplémentaires (7 500 F l’unité)</label><input id="eRet" type="number" min="0" value="${e.retouches}"></div>
      <div><label>Déclinaisons de format en plus (4 000 F)</label><input id="eDec" type="number" min="0" value="${e.declinaisons}"></div>
      <div><label>Temps de travail estimé (heures)</label><input id="eH" type="number" min="1" placeholder="" value="${e.heures ?? ''}"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--encre)"><input type="checkbox" id="eSrc" style="width:auto" ${e.sources?'checked':''}> Fichiers sources ouverts (AI, PSD, AE) : +30 %</label>
  </div>
  <div class="res-est" id="eRes"></div>
  <div id="eAlertes"></div>
  <div class="calc" id="eCalc"></div>
  <div class="carte" style="margin-top:12px"><div class="grille2">
    <div><label>Quantité sur la proforma</label><input id="eQ" type="number" min="1" value="${e.qte}"></div>
    <div><label>Prix à utiliser</label><select id="ePrixChoix"><option value="annonce">Prix annoncé</option><option value="cible">Prix cible</option><option value="plancher">Prix plancher</option></select></div></div>
    <div class="actions"><button class="btn" id="eNouveau">Créer une proforma avec ce prix</button>${brouillon?'<button class="btn sec" id="eAjout">Ajouter à la proforma en cours</button>':''}</div>
  </div>
  <div class="info">Tactique : 1ʳᵉ demande de baisse, 5 % maximum. Pour aller plus bas, obtenir une contrepartie (100 % d’avance, option en moins, délai plus long, témoignage). Sous le plancher : proposer une version réduite, sinon refus poli.</div>`;
  $('#eCx').value=e.cx; $('#eCl').value=e.cl; $('#eUrg').value=String(e.urg);
  const maj = () => {
    Object.assign(e, { g:+$('#eG').value, cx:$('#eCx').value, cl:$('#eCl').value, urg:+$('#eUrg').value, retouches:num($('#eRet').value), declinaisons:num($('#eDec').value), sources:$('#eSrc').checked, heures: $('#eH').value ? num($('#eH').value) : null, qte: Math.max(1,num($('#eQ').value)) });
    const r = estimer(e);
    $('#eH').placeholder = 'défaut : ' + r.g.heures + ' h';
    $('#eContenu').textContent = r.g.contenu + ' · délai type : ' + r.g.delai;
    $('#eRes').innerHTML = `<div class="carte annonce"><span>Prix annoncé</span><b>${Fc(r.annonce)}</b></div><div class="carte"><span>Prix cible</span><b>${Fc(r.cible)}</b></div><div class="carte"><span>Prix plancher</span><b>${Fc(r.plancher)}</b></div>`;
    const al = [];
    if (r.tauxH < 3000) al.push(`Sous-facturé : ${Fc(r.tauxH)} de l’heure pour ${r.heures} h (minimum conseillé 3 000 F/h).`);
    if (r.auDessus) al.push(`Le plancher dépasse le haut de la grille (${Fc(r.g.max)}). Vérifie la complexité ou le type de client, ou justifie le prix par le périmètre.`);
    else if (r.plafonne) al.push(`Prix annoncé limité au haut de la grille (${Fc(r.g.max)}${r.opts?' + options':''}) : la marge de négociation est réduite.`);
    $('#eAlertes').innerHTML = al.map(a=>`<div class="alerte">${a}</div>`).join('');
    $('#eCalc').innerHTML = `Calcul (pour toi, jamais pour le client) : base ${Fc(r.base)} × complexité ${String(r.kCx).replace('.',',')} × client ${String(r.kCl).replace('.',',')} × (1 + urgence ${e.urg*100} %) = ${Fc(r.prix)}${r.opts?` + options ${Fc(r.opts)}`:''} → plancher arrondi ${Fc(r.plancher)} · marge ${r.marge*100} % · ${Fc(r.tauxH)}/h sur ${r.heures} h.`;
  };
  $$('#app input, #app select').forEach(el => el.addEventListener('input', maj));
  maj();
  const ligne = () => { const r = estimer(e); const prix = r[$('#ePrixChoix').value]; return { designation:r.g.nom, description:r.g.contenu, quantite:e.qte, prix_unitaire:prix }; };
  $('#eNouveau').onclick = () => { const l = ligne(); nouveauDevis([l]); brouillon.delai = estimer(e).g.delai; brouillon.client.type = e.cl; vueDevis($('#app')); };
  if ($('#eAjout')) $('#eAjout').onclick = () => { const l = ligne(); const b = brouillon; const vide = b.lignes.length===1 && !b.lignes[0].designation && !b.lignes[0].prix_unitaire; if (vide) b.lignes[0]=l; else b.lignes.push(l); aller('devis'); toast('Ligne ajoutée'); };
}

/* ================= Aperçu avec filigrane ================= */
function vueFiligrane(app) {
  app.innerHTML = `<h2>Aperçu avec filigrane</h2>
  <div class="carte"><p style="margin-top:0">Choisis une image : elle est réduite en basse résolution (1080 px) et reçoit le filigrane Mr TIJ en bas à droite. Rien n’est envoyé sur internet.</p>
  <input type="file" id="fFichier" accept="image/*" multiple>
  <div class="grille2" style="margin-top:10px"><div><label>Taille du filigrane</label><select id="fTaille"><option value="0.18">Petit</option><option value="0.24" selected>Moyen</option><option value="0.32">Grand</option></select></div>
  <div><label>Résolution</label><select id="fRes"><option value="1080" selected>1080 px</option><option value="720">720 px</option></select></div></div>
  <div id="fSorties"></div></div>`;
  const fg = new Image(); fg.src = FILIGRANE;
  const traiter = () => {
    const files = [...$('#fFichier').files]; $('#fSorties').innerHTML = '';
    files.forEach(file => { const img = new Image(); img.onload = () => {
      const max = +$('#fRes').value, s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.className='apercu';
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
      const t = Math.round(Math.min(c.width,c.height) * +$('#fTaille').value), m = Math.round(Math.min(c.width,c.height)*0.03);
      ctx.drawImage(fg, c.width-t-m, c.height-t-m, t, t);
      const nom = file.name.replace(/\.[^.]+$/,'') + '_APERCU.jpg';
      const wrap = document.createElement('div'); wrap.appendChild(c);
      const act = document.createElement('div'); act.className='actions';
      const dl = document.createElement('a'); dl.className='btn'; dl.textContent='Télécharger'; dl.download=nom; dl.href=c.toDataURL('image/jpeg',0.72); act.appendChild(dl);
      if (navigator.canShare) { const sh = document.createElement('button'); sh.className='btn sec'; sh.textContent='Partager (WhatsApp…)';
        sh.onclick = () => c.toBlob(b => { const f = new File([b], nom, {type:'image/jpeg'}); if (navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{}); else toast('Partage non disponible'); }, 'image/jpeg', 0.72); act.appendChild(sh); }
      wrap.appendChild(act); $('#fSorties').appendChild(wrap);
      URL.revokeObjectURL(img.src); };
      img.src = URL.createObjectURL(file); });
  };
  $('#fFichier').onchange = traiter; $('#fTaille').onchange = traiter; $('#fRes').onchange = traiter;
}

  $('#gOk').onclick = () => { $$('[data-g]').forEach(inp => DB.grille[+inp.dataset.g][inp.dataset.k] = num(inp.value)); sauver(); toast('Grille enregistrée'); };
  $('#gReset').onclick = () => { if (!confirm('Remettre la grille d’origine ?')) return; DB.grille = JSON.parse(JSON.stringify(GRILLE_DEFAUT)); sauver(); aller('reglages'); };
